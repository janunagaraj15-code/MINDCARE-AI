<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cognitive Game History - MINDCARE AI</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f7f5, #e8f0ff);
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin-bottom: 0;
            color: #666;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 15px;
        }

        .back-btn {
            background: #2d887d;
            color: white;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 25px 0;
        }

        .summary-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.07);
        }

        .summary-card h2 {
            margin: 5px 0;
            color: #2d887d;
        }

        .summary-card p {
            margin: 0;
            color: #666;
        }

        .history-box {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .history-box h2 {
            margin-top: 0;
        }

        .game-card {
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .game-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-name {
            font-size: 20px;
            font-weight: bold;
        }

        .performance {
            padding: 7px 12px;
            border-radius: 20px;
            font-weight: bold;
            background: #e8f7f5;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .detail {
            background: white;
            padding: 12px;
            border-radius: 10px;
        }

        .detail strong {
            display: block;
            margin-bottom: 5px;
        }

        .date {
            margin-top: 12px;
            color: #777;
            font-size: 14px;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        .clear-btn {
            background: #e74c3c;
            color: white;
            margin-top: 15px;
        }

        @media (max-width: 700px) {

            .summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .details {
                grid-template-columns: repeat(2, 1fr);
            }

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">

        <div>

            <h1>
                🧠 MINDCARE AI
            </h1>

            <p id="historySubtitle">
                Cognitive Game History
            </p>

        </div>


        <button class="back-btn"
                onclick="goBack()">

            ← Back

        </button>

    </div>



    <!-- =========================
         SUMMARY
    ========================== -->

    <div class="summary">


        <div class="summary-card">

            <h2 id="totalGames">
                0
            </h2>

            <p>
                Total Games
            </p>

        </div>


        <div class="summary-card">

            <h2 id="bestScore">
                0
            </h2>

            <p>
                Best Score
            </p>

        </div>


        <div class="summary-card">

            <h2 id="totalMistakes">
                0
            </h2>

            <p>
                Total Mistakes
            </p>

        </div>


        <div class="summary-card">

            <h2 id="excellentGames">
                0
            </h2>

            <p>
                Excellent
            </p>

        </div>

    </div>



    <!-- =========================
         HISTORY
    ========================== -->

    <div class="history-box">

        <h2>
            📊 Previous Game Performance
        </h2>


        <div id="historyList">
        </div>


        <button class="clear-btn"
                onclick="clearHistory()">

            🗑 Clear History

        </button>

    </div>


</div>



<script>


/* =====================================================
   CURRENT LOGGED-IN PATIENT
===================================================== */

const patientId =
    sessionStorage.getItem("currentPatientId");

const patientName =
    sessionStorage.getItem("currentPatientName");


/* =====================================================
   LOGIN CHECK
===================================================== */

if (!patientId || !patientName) {

    alert("Please login first.");

    window.location.href = "index.html";

}


/* =====================================================
   PATIENT-SPECIFIC HISTORY KEY
===================================================== */

const historyKey =
    "gameHistory_" + patientId;


/* =====================================================
   SHOW PATIENT NAME
===================================================== */

document.getElementById("historySubtitle")
    .textContent =
    "Cognitive Game History - " + patientName;



/* =====================================================
   LOAD HISTORY
===================================================== */

function loadHistory() {


    let history = [];


    try {

        history =
            JSON.parse(
                localStorage.getItem(historyKey) || "[]"
            );


        /*
           Make sure history is an array.
        */

        if (!Array.isArray(history)) {

            history = [];

        }

    }

    catch (error) {

        console.error(
            "Error loading game history:",
            error
        );

        history = [];

    }


    const historyList =
        document.getElementById("historyList");


    /* =================================================
       TOTAL GAMES
    ================================================= */

    document.getElementById("totalGames")
        .textContent =
        history.length;


    /* =================================================
       NO HISTORY
    ================================================= */

    if (history.length === 0) {


        document.getElementById("bestScore")
            .textContent = "0";


        document.getElementById("totalMistakes")
            .textContent = "0";


        document.getElementById("excellentGames")
            .textContent = "0";


        historyList.innerHTML = `

            <div class="empty">

                🧠 No cognitive games completed yet.

                <br><br>

                ${patientName}, play a memory game
                to see your performance here.

            </div>

        `;


        return;

    }



    /* =================================================
       SUMMARY CALCULATION
    ================================================= */

    let bestScore = 0;

    let totalMistakes = 0;

    let excellentGames = 0;


    history.forEach(item => {


        const score =
            Number(item.score) || 0;


        const mistakes =
            Number(item.mistakes) || 0;


        if (score > bestScore) {

            bestScore = score;

        }


        totalMistakes += mistakes;


        if (
            item.performance ===
            "Excellent"
        ) {

            excellentGames++;

        }

    });



    document.getElementById("bestScore")
        .textContent =
        bestScore;


    document.getElementById("totalMistakes")
        .textContent =
        totalMistakes;


    document.getElementById("excellentGames")
        .textContent =
        excellentGames;



    /* =================================================
       NEWEST GAME FIRST
    ================================================= */

    const newestFirst =
        [...history].reverse();


    historyList.innerHTML = "";


    newestFirst.forEach(item => {


        const card =
            document.createElement("div");


        card.className =
            "game-card";


        card.innerHTML = `

            <div class="game-top">

                <div class="game-name">

                    🧠
                    ${item.game || "Memory Challenge"}

                </div>


                <div class="performance">

                    ${item.performance || "Needs Support"}

                </div>

            </div>


            <div class="details">


                <div class="detail">

                    <strong>
                        ⭐ Score
                    </strong>

                    ${item.score || 0}

                </div>


                <div class="detail">

                    <strong>
                        ⏱ Time
                    </strong>

                    ${item.time || 0} sec

                </div>


                <div class="detail">

                    <strong>
                        ❌ Mistakes
                    </strong>

                    ${item.mistakes || 0}

                </div>


                <div class="detail">

                    <strong>
                        🎯 Difficulty
                    </strong>

                    ${item.difficulty || "Easy"}

                </div>


            </div>


            <div class="date">

                📅 ${item.date || ""}

                &nbsp;&nbsp;

                🕐 ${item.timeStamp || ""}

            </div>

        `;


        historyList.appendChild(card);

    });

}



/* =====================================================
   CLEAR HISTORY
===================================================== */

function clearHistory() {


    const confirmClear =
        confirm(
            "Are you sure you want to clear all game history?"
        );


    if (!confirmClear) {

        return;

    }


    /*
       Only the CURRENT PATIENT's
       history will be deleted.
    */

    localStorage.removeItem(historyKey);


    loadHistory();

}



/* =====================================================
   BACK BUTTON
===================================================== */

function goBack() {


    /*
       Cognitive History
       →
       Memory Games
    */

    window.location.href =
        "memory-games.html";

}



/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener(
    "load",
    loadHistory
);


/* =====================================================
   PAGE SHOW
===================================================== */

window.addEventListener(
    "pageshow",
    loadHistory
);


</script>


</body>

</html>
