<script>
/* =========================================
   MINDCARE AI - MEDICINE REMINDER
   ========================================= */

let reminderTimers = [];

/* ---------- Notification Permission ---------- */

async function enableMedicineNotifications() {
    if (!("Notification" in window)) {
        alert("This browser does not support notifications.");
        return false;
    }

    if (Notification.permission === "granted") {
        return true;
    }

    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
        alert("Please allow notifications for MINDCARE AI in your browser.");
        return false;
    }

    return true;
}


/* ---------- Reminder Sound ---------- */

function playMedicineSound() {
    try {
        const AudioContext =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContext) return;

        const audioCtx = new AudioContext();

        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = "sine";
        oscillator.frequency.value = 880;

        gainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(
            0.4,
            audioCtx.currentTime + 0.05
        );

        gainNode.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + 1
        );

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 1);
    } catch (error) {
        console.log("Sound could not play:", error);
    }
}


/* ---------- Show Reminder ---------- */

function showMedicineReminder(medicineName, dosage, time) {

    // Sound
    playMedicineSound();

    // Browser notification
    if ("Notification" in window &&
        Notification.permission === "granted") {

        new Notification("💊 MINDCARE AI Medicine Reminder", {
            body:
                medicineName +
                " - " +
                dosage +
                "\nTime: " +
                time,
            icon: "https://cdn-icons-png.flaticon.com/512/2966/2966486.png",
            tag: "medicine-" + medicineName
        });
    }

    // Popup
    const popup = document.createElement("div");

    popup.innerHTML = `
        <div style="
            position:fixed;
            top:20px;
            left:50%;
            transform:translateX(-50%);
            width:90%;
            max-width:420px;
            background:white;
            padding:22px;
            border-radius:18px;
            box-shadow:0 8px 30px rgba(0,0,0,.25);
            z-index:99999;
            text-align:center;
        ">
            <div style="font-size:42px;">💊</div>

            <h2 style="margin:8px 0;">
                Medicine Reminder
            </h2>

            <p style="font-size:18px;">
                <strong>${medicineName}</strong>
            </p>

            <p>
                Dosage: ${dosage}
            </p>

            <p>
                Time: ${time}
            </p>

            <button onclick="this.parentElement.parentElement.remove()"
                style="
                    margin-top:10px;
                    padding:12px 25px;
                    border:none;
                    border-radius:10px;
                    background:#4caf50;
                    color:white;
                    font-size:16px;
                    cursor:pointer;
                ">
                OK
            </button>
        </div>
    `;

    document.body.appendChild(popup);
}


/* ---------- Schedule Reminder ---------- */

function scheduleMedicineReminder(
    medicineName,
    dosage,
    medicineTime
) {

    const [hours, minutes] = medicineTime.split(":").map(Number);

    const now = new Date();

    let reminderTime = new Date();

    reminderTime.setHours(hours);
    reminderTime.setMinutes(minutes);
    reminderTime.setSeconds(0);
    reminderTime.setMilliseconds(0);

    // If today's time already passed,
    // schedule for tomorrow.
    if (reminderTime <= now) {
        reminderTime.setDate(
            reminderTime.getDate() + 1
        );
    }

    const delay = reminderTime.getTime() - now.getTime();

    const timer = setTimeout(() => {

        showMedicineReminder(
            medicineName,
            dosage,
            medicineTime
        );

        // Schedule again for next day
        scheduleMedicineReminder(
            medicineName,
            dosage,
            medicineTime
        );

    }, delay);

    reminderTimers.push(timer);

    console.log(
        "Medicine reminder scheduled:",
        medicineName,
        reminderTime
    );
}


/* ---------- Start Reminders ---------- */

async function startMedicineReminders() {

    const permission =
        await enableMedicineNotifications();

    if (!permission) return;

    // Clear old timers
    reminderTimers.forEach(timer => clearTimeout(timer));
    reminderTimers = [];

    /*
      IMPORTANT:
      Change this section according to your
      prescription data.
    */

    const patientId =
        sessionStorage.getItem("currentPatientId");

    if (!patientId) {
        console.log("No patient logged in.");
        return;
    }

    const prescriptionKey =
        "mindcarePrescription_" + patientId;

    const prescription =
        JSON.parse(
            localStorage.getItem(prescriptionKey) || "null"
        );

    if (!prescription) {
        console.log("No prescription found.");
        return;
    }

    /*
      Supports either:
      prescription.medicine
      or
      prescription.medicines[]
    */

    if (Array.isArray(prescription.medicines)) {

        prescription.medicines.forEach(medicine => {

            if (
                medicine.time &&
                medicine.medicine
            ) {
                scheduleMedicineReminder(
                    medicine.medicine,
                    medicine.dosage || "",
                    medicine.time
                );
            }

        });

    } else if (prescription.medicine) {

        scheduleMedicineReminder(
            prescription.medicine,
            prescription.dosage || "",
            prescription.time
        );
    }

    console.log(
        "✅ Medicine reminders started"
    );
}


/* ---------- Start when page opens ---------- */

window.addEventListener("load", () => {

    // Do NOT automatically ask permission.
    // User must interact first.

    const button = document.createElement("button");

    button.innerHTML =
        "🔔 Enable Medicine Reminders";

    button.style.cssText = `
        position:fixed;
        bottom:20px;
        right:20px;
        z-index:9999;
        padding:14px 18px;
        border:none;
        border-radius:12px;
        background:#4caf50;
        color:white;
        font-size:15px;
        box-shadow:0 4px 15px rgba(0,0,0,.2);
        cursor:pointer;
    `;

    button.onclick = async () => {

        const allowed =
            await enableMedicineNotifications();

        if (allowed) {
            await startMedicineReminders();

            button.innerHTML =
                "✅ Reminders Enabled";

            button.disabled = true;
            button.style.opacity = "0.7";
        }
    };

    document.body.appendChild(button);
});
</script>
